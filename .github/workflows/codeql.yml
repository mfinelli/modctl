---
name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '29 3 * * 1'  # 03.29 UTC on monday

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
          - language: javascript-typescript  # documentation website javascript
            build-mode: none

    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: 1.31.1
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - run: sudo apt-get update
        if: matrix.build-mode == 'manual'
      - run: sudo apt-get install -y libarchive-tools
        if: matrix.build-mode == 'manual'

      - run: |
          go mod download
          make
        if: matrix.build-mode == 'manual'

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
