---
name: Package
on: push

jobs:
  main:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:jammy  # glibc floor
    steps:
      - run: apt-get update
      - run: apt-get upgrade -y
      - run: |
          apt-get install -y \
            apt-utils \
            ca-certificates \
            binutils-aarch64-linux-gnu \
            build-essential \
            createrepo-c \
            debsigs \
            file \
            gcc-aarch64-linux-gnu \
            libarchive-tools \
            rclone \
            rpm \
            tree \
            unzip
      - uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: 1.30.0
      - run: sqlc generate
      - run: go install github.com/google/go-licenses/v2@latest
      - run: ./pkg/builddeb.bash
      - run: ./pkg/buildrpm.bash
      - run: ./pkg/publish.bash
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      - run: go mod vendor
      - uses: actions/upload-artifact@v6
        with:
          name: deb
          path: pkg/*.deb
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: rpm
          path: pkg/rpmbuild/RPMS/**/*.rpm
          retention-days: 1

  # we use a ubuntu image here even just for the arch build because when we
  # bump the minimum to noble we can unify these two steps (makepkg/packman
  # are not in the jammy image but they are in the noble image)
  arch:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    # needs: [main]
    steps:
      - run: apt-get update
      - run: apt-get upgrade -y
      - run: |
          apt-get install -y \
            ca-certificates \
            build-essential \
            file \
            gcc-aarch64-linux-gnu \
            libarchive-tools \
            makepkg \
            pacman-package-manager \
            rclone \
            tree \
            unzip \
            zstd
      - uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: 1.30.0
      - run: sqlc generate
      - run: go install github.com/google/go-licenses/v2@latest
      - run: useradd -m builder
      - run: ./pkg/buildarch.bash
      - uses: actions/upload-artifact@v6
        with:
          name: arch
          path: |
            pkg/arch/*-aarch64.pkg.tar.zst
            pkg/arch/*-aarch64.pkg.tar.zst.sig
            pkg/arch/*-x86_64.pkg.tar.zst
            pkg/arch/*-x86_64.pkg.tar.zst.sig
          retention-days: 1
